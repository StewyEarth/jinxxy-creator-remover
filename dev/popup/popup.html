<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div id="popup-content" class="popup-container">
        <button id="infoButton">i</button>
        <div id="infoPopup" class="">
            <h3 class="infoPopupTitle">About Jinxxy Companion:</h3>
            <ul class="infoDetailsList">
                <li class="infoDetails">
                    Current Version: <span id="infoPopupVersion" class="infoDetailValue">1.0.5</span>
                </li>
                <li class="infoDetails">
                    Last Currency update: <span id="infoPopupCurrencyLastUpdate" class="infoDetailValue">2026-01-09</span>
                </li>
                <li class="infoDetails">
                    Created by: <a href="https://guns.lol/scoopdewoo" id="infoPopupCreator" class="infoDetailValue">Scoopdewoo</a>
                </li>
                <li class="infoDetails">
                    Source code <a href="https://github.com/StewyEarth/Jinxxy-Creator-Remover" class="infoDetailValue">Github</a>
                </li>
            </ul>
        </div>


        <h1 class="popup-title">Jinxxy companion</h1>
        <h3 class="section-title">Hide Creators</h3>
        <label for="creatorsToHide" class="label">Enter creator names to hide (comma separated):</label>
        <input type="text" id="creatorsToHide" name="creators" class="input" required>
        <button type="submit" id="saveButton" class="button">Hide Creator/creators</button>
        <p id="statusText" class="status hidden"></p>
        <h3 class="creator-list-title hidden" id="creatorlistTitle">Hidden creators:</h3>
        <ul id="creatorList" class="creator-list"></ul>
        <button type="reset" id="resetButton" class="button button-reset hidden">Reset</button>
        <details>
            <summary class="section-title" id="optionsList">Options</summary>
            <ul class="options-list">
                <li>
                    <label for="sortByLatestCheckbox">
                        Fix links to sort by latest
                        <input type="checkbox" id="sortByLatestCheckbox" class="checkbox">
                    </label>
                </li>
                <li>
                    <label for="hidePromotedCheckbox">
                        Hide promoted listings
                        <input type="checkbox" id="hidePromotedCheckbox" class="checkbox">
                    </label>
                </li>
                <li>
                    <label for="fixBrokenLinksCheckbox">
                        Fix Broken Links
                        <input type="checkbox" id="fixBrokenLinksCheckbox" class="checkbox" checked>
                    </label>
                </li>
                <li>
                    <label for="searchableTagsCheckbox">
                        Add Searchable Tags
                        <input type="checkbox" id="searchableTagsCheckbox" class="checkbox" checked>
                    </label>
                </li>
                <li>
                    <label for="currencyselect">
                        Convert currency:
                        <select id="currencyselect" class="popupselect">
                            <option value="none">None</option>
                        </select>
                    </label>
                </li>
            </ul>

        </details>
    </div>
    <script src="popup.js"></script>
</body>

</html>
